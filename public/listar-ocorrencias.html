<body class="index-page">

<main class="main"><section class="section" style="padding-top:120px;padding-bottom:60px"><div class="container" data-aos="fade-up"><div class="section-title text-center mb-4"><h2>Lista de ocorrências (espaço verde)</h2></div><div id="list" class="table-responsive"></div></div></section></main>

</body></html><script>
(async()=>{
 const d=await fetch('/api/ocorrencias?tipo=verde').then(r=>r.json());
 const el=document.getElementById('list');
 if(!d.ok||!d.data.length){el.innerHTML='<p class="text-center text-muted">Sem registos.</p>';return;}
 el.innerHTML='<table class="table table-striped"><thead><tr><th>ID</th><th>Descrição</th><th>Local</th><th>Data</th></tr></thead><tbody>'+d.data.map(o=>'<tr><td>'+o.id+'</td><td>'+(o.descricao||'')+'</td><td>'+(o.place_name||'')+'</td><td>'+(o.data_ocorrencia||'')+'</td></tr>').join('')+'</tbody></table>';
})();
</script>
